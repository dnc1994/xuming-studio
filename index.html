<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>续命工坊：膜蛤版</title>
  <style>
    :root {
      --bg-1: #efe3c8;
      --bg-2: #d7b46a;
      --ink: #1d1a15;
      --card: rgba(255, 247, 226, 0.88);
      --accent: #a50f15;
      --accent-2: #0f5d2f;
      --muted: #5c5548;
      --line: rgba(29, 26, 21, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Noto Serif SC", "Source Han Serif SC", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(165, 15, 21, 0.1), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(15, 93, 47, 0.1), transparent 38%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
      padding: 24px;
    }

    .wrap {
      max-width: 1060px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 30px;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .big-number {
      font-size: clamp(30px, 5vw, 54px);
      line-height: 1.05;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .resource-label {
      color: var(--muted);
      margin-bottom: 14px;
      font-size: 14px;
    }

    .click-btn {
      width: 100%;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 18px;
      font-size: clamp(20px, 3.4vw, 28px);
      font-weight: 700;
      color: #fff5dc;
      background: linear-gradient(120deg, var(--accent), #c5262c);
      box-shadow: 0 10px 0 #7b0b11, 0 12px 20px rgba(123, 11, 17, 0.24);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .click-btn:active {
      transform: translateY(5px);
      box-shadow: 0 5px 0 #7b0b11;
    }

    .stats {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.45);
    }

    .stat .k {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .stat .v {
      font-weight: 700;
      font-size: 18px;
    }

    .shop-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .shop-title h2 {
      font-size: 24px;
    }

    .shop-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .upgrade-list {
      display: grid;
      gap: 10px;
      max-height: 520px;
      overflow: auto;
      padding-right: 4px;
    }

    .upgrade {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.5);
      padding: 10px;
    }

    .upgrade .name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .upgrade .desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .upgrade .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .upgrade button {
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(120deg, var(--accent-2), #1e8f4b);
      color: #f4ffe9;
    }

    .upgrade button:disabled {
      cursor: not-allowed;
      background: #8f8b84;
      color: #dfd9cf;
    }

    .log {
      margin-top: 16px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.38);
      min-height: 120px;
      font-size: 13px;
      line-height: 1.5;
      color: #3d372e;
    }

    .toolbar {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .toolbar button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.55);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      body {
        padding: 14px;
      }

      .wrap {
        grid-template-columns: 1fr;
      }

      .upgrade-list {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1>续命工坊：膜蛤版</h1>
      <p class="subtitle">点击续一秒，靠梗文化升级，目标是把可用寿命推到天文数字。</p>

      <div id="lifeAmount" class="big-number">0 秒</div>
      <div class="resource-label">当前可支配续命秒数</div>

      <button id="clickBtn" class="click-btn">+1 秒 · 立即续命</button>

      <div class="stats">
        <div class="stat">
          <div class="k">总续命</div>
          <div id="totalLife" class="v">0 秒</div>
        </div>
        <div class="stat">
          <div class="k">手动续命/次</div>
          <div id="clickPower" class="v">1.00 秒</div>
        </div>
        <div class="stat">
          <div class="k">自动续命/秒</div>
          <div id="autoRate" class="v">0.00 秒</div>
        </div>
        <div class="stat">
          <div class="k">全局倍率</div>
          <div id="globalMultiplier" class="v">x1.00</div>
        </div>
      </div>

      <div class="log" id="logBox"></div>
      <div class="toolbar">
        <button id="saveBtn">立刻保存</button>
        <button id="resetBtn">重开轮回</button>
      </div>
    </section>

    <section class="panel">
      <div class="shop-title">
        <h2>梗学研究所</h2>
        <span>花费续命秒数购买升级</span>
      </div>
      <div id="upgradeList" class="upgrade-list"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "moha-clicker-save-v1";

    const upgrades = [
      {
        id: "red_boy",
        name: "红衣男孩观察团",
        description: "围观气氛拉满，手动续命效率提升。",
        baseCost: 12,
        growth: 1.22,
        unlockAt: 0,
        effect: () => ({ clickAdd: 1.0 })
      },
      {
        id: "hk_reporter",
        name: "香港记者追问机",
        description: "持续追问，产生稳定自动续命。",
        baseCost: 55,
        growth: 1.27,
        unlockAt: 20,
        effect: () => ({ autoAdd: 0.8 })
      },
      {
        id: "hawaii_guitar",
        name: "Hawaii Guitar 即兴课",
        description: "节奏感上线，全局续命效率乘算提升。",
        baseCost: 180,
        growth: 1.35,
        unlockAt: 120,
        effect: () => ({ multMul: 1.12 })
      },
      {
        id: "wallace",
        name: "西方的华莱士访谈档案",
        description: "谈笑风生，手动和自动都得到强化。",
        baseCost: 520,
        growth: 1.38,
        unlockAt: 350,
        effect: () => ({ clickAdd: 2.4, autoAdd: 1.8 })
      },
      {
        id: "duck_pen",
        name: "鸭嘴笔批注系统",
        description: "记录效率提升，手动续命获得额外乘区。",
        baseCost: 1350,
        growth: 1.43,
        unlockAt: 800,
        effect: () => ({ clickMul: 1.2 })
      },
      {
        id: "three_tables",
        name: "三个表统计中枢",
        description: "把增长写进三张表，自动续命暴涨。",
        baseCost: 3800,
        growth: 1.48,
        unlockAt: 2200,
        effect: () => ({ autoAdd: 7.5, multMul: 1.08 })
      },
      {
        id: "basic_law",
        name: "基本法精读班",
        description: "你现在很熟悉流程了，整体效率大幅跃迁。",
        baseCost: 9800,
        growth: 1.55,
        unlockAt: 6000,
        effect: () => ({ multMul: 1.32 })
      }
    ];

    const storyMilestones = [
      { at: 1, text: "续命系统启动：每次点击 +1 秒。" },
      { at: 60, text: "蛤学入门：开始出现稳定的梗学产能。" },
      { at: 500, text: "你已经从手工续命转向工业化续命。" },
      { at: 5000, text: "进入高阶阶段：倍率才是硬道理。" },
      { at: 50000, text: "你正在挑战‘续到天荒地老’的目标。" }
    ];

    const state = {
      life: 0,
      totalLife: 0,
      clickBase: 1,
      clickBonusAdd: 0,
      clickBonusMul: 1,
      autoBase: 0,
      globalMul: 1,
      levels: Object.fromEntries(upgrades.map((u) => [u.id, 0])),
      milestonesSeen: {},
      lastSaveAt: 0
    };

    const el = {
      lifeAmount: document.getElementById("lifeAmount"),
      totalLife: document.getElementById("totalLife"),
      clickPower: document.getElementById("clickPower"),
      autoRate: document.getElementById("autoRate"),
      globalMultiplier: document.getElementById("globalMultiplier"),
      clickBtn: document.getElementById("clickBtn"),
      upgradeList: document.getElementById("upgradeList"),
      logBox: document.getElementById("logBox"),
      saveBtn: document.getElementById("saveBtn"),
      resetBtn: document.getElementById("resetBtn")
    };

    function fmt(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(2) + "B";
      if (num >= 1e6) return (num / 1e6).toFixed(2) + "M";
      if (num >= 1e3) return (num / 1e3).toFixed(2) + "K";
      return num.toFixed(2);
    }

    function calcClickPower() {
      return (state.clickBase + state.clickBonusAdd) * state.clickBonusMul * state.globalMul;
    }

    function calcAutoRate() {
      return state.autoBase * state.globalMul;
    }

    function costFor(upgrade) {
      const lv = state.levels[upgrade.id] || 0;
      return Math.floor(upgrade.baseCost * Math.pow(upgrade.growth, lv));
    }

    function log(text) {
      const row = document.createElement("div");
      row.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      el.logBox.prepend(row);
      while (el.logBox.children.length > 12) {
        el.logBox.removeChild(el.logBox.lastChild);
      }
    }

    function applyUpgradeEffect(upgrade) {
      const out = upgrade.effect();
      if (out.clickAdd) state.clickBonusAdd += out.clickAdd;
      if (out.autoAdd) state.autoBase += out.autoAdd;
      if (out.clickMul) state.clickBonusMul *= out.clickMul;
      if (out.multMul) state.globalMul *= out.multMul;
    }

    function renderUpgrades() {
      el.upgradeList.innerHTML = "";
      for (const up of upgrades) {
        if (state.totalLife < up.unlockAt) continue;
        const lv = state.levels[up.id] || 0;
        const cost = costFor(up);
        const card = document.createElement("div");
        card.className = "upgrade";

        const canBuy = state.life >= cost;
        card.innerHTML = `
          <div class="name">${up.name} Lv.${lv}</div>
          <div class="desc">${up.description}</div>
          <div class="meta">
            <div>价格: <strong>${fmt(cost)}</strong> 秒</div>
            <button ${canBuy ? "" : "disabled"} data-up="${up.id}">购买</button>
          </div>
        `;
        el.upgradeList.appendChild(card);
      }
    }

    function refreshUpgradeButtons() {
      const buttons = el.upgradeList.querySelectorAll("button[data-up]");
      for (const btn of buttons) {
        const up = upgrades.find((u) => u.id === btn.dataset.up);
        if (!up) continue;
        btn.disabled = state.life < costFor(up);
      }
    }

    function renderStats() {
      el.lifeAmount.textContent = `${fmt(state.life)} 秒`;
      el.totalLife.textContent = `${fmt(state.totalLife)} 秒`;
      el.clickPower.textContent = `${fmt(calcClickPower())} 秒`;
      el.autoRate.textContent = `${fmt(calcAutoRate())} 秒`;
      el.globalMultiplier.textContent = `x${state.globalMul.toFixed(2)}`;
    }

    function manualClick() {
      const gain = calcClickPower();
      state.life += gain;
      state.totalLife += gain;
      checkMilestones();
      renderStats();
      renderUpgrades();
    }

    function buyUpgrade(id) {
      const up = upgrades.find((u) => u.id === id);
      if (!up) return;
      const cost = costFor(up);
      if (state.life < cost) return;

      state.life -= cost;
      state.levels[up.id] += 1;
      applyUpgradeEffect(up);
      log(`购买 ${up.name}，续命系统进一步强化。`);
      renderStats();
      renderUpgrades();
    }

    function checkMilestones() {
      for (const m of storyMilestones) {
        if (state.totalLife >= m.at && !state.milestonesSeen[m.at]) {
          state.milestonesSeen[m.at] = true;
          log(m.text);
        }
      }
    }

    function tick(dt) {
      const add = calcAutoRate() * dt;
      if (add > 0) {
        const before = state.totalLife;
        state.life += add;
        state.totalLife += add;
        checkMilestones();
        const unlockedByAuto = upgrades.some(
          (up) => up.unlockAt > before && up.unlockAt <= state.totalLife
        );
        if (unlockedByAuto) renderUpgrades();
      }
    }

    function save() {
      const payload = {
        ...state,
        savedAt: Date.now()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      state.lastSaveAt = Date.now();
      log("已保存当前进度。");
    }

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        if (!data || typeof data !== "object") return;

        state.life = Number(data.life || 0);
        state.totalLife = Number(data.totalLife || 0);
        state.clickBase = Number(data.clickBase || 1);
        state.clickBonusAdd = Number(data.clickBonusAdd || 0);
        state.clickBonusMul = Number(data.clickBonusMul || 1);
        state.autoBase = Number(data.autoBase || 0);
        state.globalMul = Number(data.globalMul || 1);
        state.levels = { ...state.levels, ...(data.levels || {}) };
        state.milestonesSeen = data.milestonesSeen || {};

        if (data.savedAt) {
          const offlineSec = Math.max(0, (Date.now() - Number(data.savedAt)) / 1000);
          if (offlineSec > 1 && calcAutoRate() > 0) {
            const bonus = calcAutoRate() * Math.min(offlineSec, 8 * 60 * 60);
            state.life += bonus;
            state.totalLife += bonus;
            log(`离线续命 +${fmt(bonus)} 秒。`);
          }
        }
      } catch (_) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    el.clickBtn.addEventListener("click", manualClick);
    el.upgradeList.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-up]");
      if (!btn) return;
      buyUpgrade(btn.dataset.up);
    });

    el.saveBtn.addEventListener("click", save);
    el.resetBtn.addEventListener("click", () => {
      const yes = window.confirm("确认重开轮回？这会清空本地存档。");
      if (!yes) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    });

    let lastUpdateMs = Date.now();
    function stepGame() {
      const nowMs = Date.now();
      const elapsedSec = Math.max(0, (nowMs - lastUpdateMs) / 1000);
      lastUpdateMs = nowMs;
      tick(elapsedSec);
      renderStats();
      refreshUpgradeButtons();
      if (Date.now() - state.lastSaveAt > 8000) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, savedAt: Date.now() }));
        state.lastSaveAt = Date.now();
      }
    }

    load();
    if (!Object.keys(state.milestonesSeen).length) {
      log("欢迎来到续命工坊。先点一下，先续一秒。");
    }
    checkMilestones();
    renderStats();
    renderUpgrades();
    setInterval(stepGame, 250);

    // Immediate catch-up when tab becomes visible again.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        stepGame();
      }
    });

    window.addEventListener("beforeunload", () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, savedAt: Date.now() }));
    });
  </script>
</body>
</html>
